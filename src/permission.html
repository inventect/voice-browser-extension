<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Voice Browser · Allow the microphone</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="ui.css" />
<link rel="stylesheet" href="pages.css" />
</head>
<body>
<div class="page permission center">
  <section class="card rise">
    <svg class="mark" viewBox="0 0 128 128" aria-hidden="true"><defs><linearGradient id="vbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2997ff"/><stop offset="1" stop-color="#0071e3"/></linearGradient></defs><rect x="4" y="4" width="120" height="120" rx="28" fill="url(#vbg)"/><rect x="49" y="24" width="30" height="50" rx="15" fill="#fff"/><path d="M37 62a27 27 0 0 0 54 0" fill="none" stroke="#fff" stroke-width="7.5" stroke-linecap="round"/><path d="M64 89v13M51 102h26" fill="none" stroke="#fff" stroke-width="7.5" stroke-linecap="round"/></svg>
    <h1 id="ptitle">Allow the microphone</h1>
    <p class="lede" id="plede">Voice Browser needs to hear you. Chrome can’t ask from inside the side panel, so it asks here, once. Choose <b>Allow</b> in the prompt — not “Allow this time”.</p>
    <button id="retry" class="btn primary">Allow microphone</button>
    <p id="status" class="status-line">Waiting for Chrome’s prompt…</p>
    <div class="links">
      <button id="settings">Open Chrome site settings</button>
      <button id="close">Close this tab</button>
    </div>
    <p class="small muted" id="pnote" style="margin:18px 0 0">Nothing is recorded by the extension.</p>
  </section>
</div>
<script src="permission.js"></script>
</body>
</html>
